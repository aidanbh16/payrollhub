# Redis: the shared store for the distributed rate limiter (Assignment 5, Section 2.2).
# Start: docker compose up -d     Stop: docker compose down
# The password comes from REDIS_PASSWORD in .env. Copy .env.example to .env first.
name: payrollhub

services:
  redis:
    image: redis:7.4-alpine
    container_name: payrollhub-redis
    # Rate-limit counters are short-lived, so persistence is off.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env (copy .env.example to .env)}
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Bound to localhost only, so Redis is not reachable from the network.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
